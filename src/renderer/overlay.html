<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: transparent;
      overflow: hidden;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    .overlay {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      height: 100vh;
      width: 100vw;
      padding-bottom: 14px;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 6px 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    .mic-icon {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff3b30;
      animation: pulse 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .waveform {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 16px;
    }

    .bar {
      width: 2px;
      border-radius: 1px;
      background: #ffffff;
      transition: height 0.08s ease;
      min-height: 3px;
    }

    /* Processing state */
    .pill.processing .mic-icon {
      background: #ff9500;
      animation: none;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="pill" id="pill">
      <div class="mic-icon"></div>
      <div class="waveform" id="waveform"></div>
    </div>
  </div>

  <script src="../../dist/renderer/overlay.js"></script>
</body>
</html>
